apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plugin-user-management.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-user-management.labels" . | nindent 4 }}
---
# Cluster-wide because database namespaces are created dynamically.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "plugin-user-management.fullname" . }}
  labels:
    {{- include "plugin-user-management.labels" . | nindent 4 }}
rules:
  # The plugin's own API: declared users and databases, reconciled by the backend.
  - apiGroups: ["plugin-user-management.plugins.openeverest.io"]
    resources: ["instanceusers", "instancedatabases", "instancebuckets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["plugin-user-management.plugins.openeverest.io"]
    resources: ["instanceusers/status", "instancedatabases/status", "instancebuckets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["plugin-user-management.plugins.openeverest.io"]
    resources: ["instanceusers/finalizers", "instancedatabases/finalizers", "instancebuckets/finalizers"]
    verbs: ["update"]
  # Generated passwords, the operator's user admin credentials and TLS CA.
  # list/watch feed an informer restricted to the plugin's own credentials
  # Secrets (by label); other Secrets are only ever read one by one.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The Instance a user belongs to: its provider and UID for owner references.
  - apiGroups: ["core.openeverest.io"]
    resources: ["instances"]
    verbs: ["get"]
  # MongoDB: users are declared in spec.users (server-side apply under the
  # plugin's own field manager); host and TLS mode are read from it.
  - apiGroups: ["psmdb.percona.com"]
    resources: ["perconaservermongodbs"]
    verbs: ["get", "patch"]
  # CloudNativePG: each user is a DatabaseRole and each database a Database
  # (server-side apply), deleted to drop or release them; DatabaseRoles and
  # Databases declared outside the plugin are listed so they're never taken
  # over. The Cluster gives the endpoint, CA, reserved roles and databases,
  # and is their owner.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databaseroles", "databases"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
  # Percona PostgreSQL: users are login roles managed in SQL as the operator's
  # postgres superuser (Secret <cluster>-pguser-postgres). The
  # PerconaPGCluster gives the endpoints, TLS Secret and reserved users.
  - apiGroups: ["pgv2.percona.com"]
    resources: ["perconapgclusters"]
    verbs: ["get"]
  # MSSQL: logins and databases are managed in T-SQL as sa (Secret
  # everest-secrets-<instance>). The MSSQLAvailabilityGroup or MSSQLInstance
  # gives the endpoint, TLS Secret and readiness.
  - apiGroups: ["mssql.solanica.io"]
    resources: ["mssqlavailabilitygroups", "mssqlinstances"]
    verbs: ["get"]
  # MariaDB: the operator reconciles User, Grant and Database resources,
  # while the cluster and its root credentials provide the actual state.
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["mariadbs"]
    verbs: ["get"]
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["users", "grants", "databases"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Valkey: users are declared in the ValkeyCluster's spec.acl.users
  # (server-side apply under the plugin's own field manager). The operator
  # renders them into Secret internal-<instance>-acl; the ValkeyNodes tell
  # which revision of it each Valkey node has loaded.
  - apiGroups: ["valkey.io"]
    resources: ["valkeyclusters"]
    verbs: ["get", "patch"]
  - apiGroups: ["valkey.io"]
    resources: ["valkeynodes"]
    verbs: ["list"]
  # SeaweedFS: native IAM identities, access keys, policies and bindings are
  # created per user. The Seaweed CR is read to verify the instance exists.
  - apiGroups: ["seaweed.seaweedfs.com"]
    resources: ["seaweeds"]
    verbs: ["get"]
  - apiGroups: ["seaweed.seaweedfs.com"]
    resources: ["s3identities", "s3credentials", "s3policies", "s3policybindings", "buckets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "plugin-user-management.fullname" . }}
  labels:
    {{- include "plugin-user-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "plugin-user-management.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "plugin-user-management.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election, so only one replica reconciles.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "plugin-user-management.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-user-management.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "plugin-user-management.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-user-management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "plugin-user-management.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "plugin-user-management.fullname" . }}
    namespace: {{ .Release.Namespace }}
